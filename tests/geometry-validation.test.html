<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>DrawForge validation tests</title><style>body{font:16px system-ui;margin:32px;color:#172033}.ok{color:#16803b}.fail{color:#b42318}pre{background:#f5f7fa;padding:16px}</style></head><body><h1>Проверка геометрии DrawForge</h1><pre id="out"></pre><script src="../geometry-validation.js"></script><script>
(function(){var out=document.getElementById('out'),passed=0,failed=0,V=DrawForgeValidation;
function test(name,fn){try{fn();passed++;out.innerHTML+='<span class="ok">✓ '+name+'</span>\n'}catch(e){failed++;out.innerHTML+='<span class="fail">✗ '+name+': '+e.message+'</span>\n'}}
function equal(a,b){if(a!==b)throw new Error('ожидалось '+b+', получено '+a)}
function square(){return[{type:'line',x1:0,y1:0,x2:10,y2:0},{type:'line',x1:10,y1:0,x2:10,y2:10},{type:'line',x1:10,y1:10,x2:0,y2:10},{type:'line',x1:0,y1:10,x2:0,y2:0}]}
test('замкнутый квадрат проходит',function(){equal(V.validateContours(square()).length,0)});
test('разрыв определяется',function(){equal(V.validateContours(square().slice(0,3))[0].code,'open_contour')});
test('допуск соединяет близкие точки',function(){var x=square();x[1].x1=10.005;equal(V.validateContours(x,{tolerance:.01}).length,0)});
test('открытая ломаная определяется',function(){equal(V.validateContours([{type:'polyline',points:[{x:0,y:0},{x:10,y:0}]}])[0].code,'open_polyline')});
test('внутреннее пересечение определяется',function(){var bow={id:'b',type:'polygon',points:[{x:0,y:0},{x:10,y:10},{x:0,y:10},{x:10,y:0}]};equal(V.validateIntersections([bow])[0].code,'self_intersection')});
test('обычные углы не считаются пересечением',function(){equal(V.validateIntersections([{type:'rect',x:0,y:0,w:10,h:10}]).length,0)});
test('согласованные проекции проходят',function(){var p={front:[{type:'rect',x:0,y:0,w:100,h:50}],top:[{type:'rect',x:0,y:0,w:100,h:30}],side:[{type:'rect',x:0,y:0,w:30,h:50}]};equal(V.validateProjections(p).length,0)});
test('несовпадение ширины определяется',function(){var p={front:[{type:'rect',x:0,y:0,w:100,h:50}],top:[{type:'rect',x:0,y:0,w:90,h:30}],side:[{type:'rect',x:0,y:0,w:30,h:50}]};equal(V.validateProjections(p)[0].code,'projection_mismatch')});
out.innerHTML+='\nИтого: '+passed+' успешно, '+failed+' ошибок.';document.title=failed?'FAIL: DrawForge tests':'PASS: DrawForge tests';})();
</script></body></html>
