name: Integrate contour validation
on:
  push:
    branches: [main]
    paths:
      - geometry-validation.js
      - validation-ui.js
      - .github/workflows/integrate-validation.yml
permissions:
  contents: write
jobs:
  wire-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add validation scripts to the app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          marker = '<script src="app.js"></script>'
          scripts = '<script src="geometry-validation.js"></script>\n' + marker + '\n<script src="validation-ui.js"></script>'
          if 'geometry-validation.js' not in text:
              if marker not in text:
                  raise SystemExit('app.js script marker not found')
              path.write_text(text.replace(marker, scripts))
          PY
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: load contour validation in app"
          git push
