name: Integrate projection links
on:
  push:
    branches: [main]
    paths: [projection-links.js, projection-links-ui.js]
permissions: {contents: write}
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); marker='<script src="validation-ui.js"></script>'
          add='<script src="projection-links.js"></script>\n<script src="projection-links-ui.js"></script>'
          if 'projection-links.js' not in s: p.write_text(s.replace(marker,marker+'\n'+add))
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html && git commit -m "chore: load linked projection dimensions" && git push
