name: Integrate storage module
on:
  push:
    branches: [main]
    paths: [modules/storage.js, modules/storage-ui.js]
permissions: {contents: write}
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text();marker='<script src="app.js"></script>';ui='<script src="modules/history-ui.js"></script>'
          if 'modules/storage.js' not in s:s=s.replace(marker,'<script src="modules/storage.js"></script>\n'+marker)
          if 'modules/storage-ui.js' not in s:s=s.replace(ui,ui+'\n<script src="modules/storage-ui.js"></script>')
          p.write_text(s)
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html && git commit -m "chore: load storage module" && git push
