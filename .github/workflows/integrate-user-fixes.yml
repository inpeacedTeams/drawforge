name: Integrate user fixes
on:
  push:
    branches: [main]
    paths: [modules/storage-bootstrap.js, modules/user-ux.js]
permissions: {contents: write}
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text();app='<script src="app.js"></script>';last='<script src="projection-links-ui.js"></script>'
          if 'storage-bootstrap.js' not in s:s=s.replace(app,'<script src="modules/storage-bootstrap.js"></script>\n'+app)
          if 'user-ux.js' not in s:s=s.replace(last,last+'\n<script src="modules/user-ux.js"></script>')
          p.write_text(s)
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html && git commit -m "chore: load user-facing fixes" && git push
