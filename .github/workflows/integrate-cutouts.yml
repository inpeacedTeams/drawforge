name: Integrate cutouts
on:
  push:
    branches: [main]
    paths: [modules/geometry-3d.js, modules/cutouts-ui.js]
permissions: {contents: write}
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text();marker='<script src="modules/edge-features-ui.js"></script>'
          if 'modules/cutouts-ui.js' not in s:s=s.replace(marker,marker+'\n<script src="modules/cutouts-ui.js"></script>')
          p.write_text(s)
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html && git commit -m "chore: load cutouts UI" && git push
