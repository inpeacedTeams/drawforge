name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Забираем код
        uses: actions/checkout@v4

      - name: Включаем и настраиваем Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Собираем артефакт сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Публикуем
        id: deployment
        uses: actions/deploy-pages@v4
