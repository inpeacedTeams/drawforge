name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm test
      - run: node tests/projection-links.test.js
      - run: node tests/modules.test.js
      - run: node tests/storage.test.js
      - run: node tests/export.test.js
      - run: node tests/geometry-3d.test.js
      - run: node tests/user-critical.test.js
      - run: node tests/edge-features.test.js
