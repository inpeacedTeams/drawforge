name: Integrate 3D modules
on:
  push:
    branches: [main]
    paths: [modules/geometry-3d.js, modules/stl.js, modules/geometry-3d-ui.js]
permissions: {contents: write}
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text();marker='<script src="app.js"></script>';ui='<script src="modules/export-ui.js"></script>'
          pure='<script src="modules/geometry-3d.js"></script>\n<script src="modules/stl.js"></script>\n'
          if 'modules/geometry-3d.js' not in s:s=s.replace(marker,pure+marker)
          if 'modules/geometry-3d-ui.js' not in s:s=s.replace(ui,ui+'\n<script src="modules/geometry-3d-ui.js"></script>')
          p.write_text(s)
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html && git commit -m "chore: load 3D geometry modules" && git push
